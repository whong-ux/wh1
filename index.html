<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台中一日遊 Story Map 彈跳視窗</title>
    <style>
        /* 右上角按鈕樣式（與查看更多綠色外觀一致） */
        .top-nav {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 1000;
        }

        .storymap-btn {
            display: inline-block;
            background-color: #6c9977;
            color: #ffffff !important;
            text-decoration: none;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s;
        }

        .storymap-btn:hover {
            background-color: #456b4e;
        }

        /* 彈跳視窗遮罩（透過純 CSS :target 觸發，無須 JS） */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }

        .modal-overlay:target {
            display: flex;
        }

        /* 點擊遮罩背景直接關閉 */
        .modal-backdrop-close {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 彈窗內容容器 */
        .modal-container {
            background-color: #ffffff;
            width: 92%;
            max-width: 1100px;
            height: 85vh;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
        }

        .modal-header {
            background-color: #e5ebdf;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            color: #52785b;
        }

        .close-btn {
            text-decoration: none;
            font-size: 28px;
            color: #52785b;
            cursor: pointer;
            line-height: 1;
            padding: 0 5px;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #222222;
        }

        .modal-body {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        @media (max-width: 600px) {
            .top-nav {
                top: 15px;
                right: 15px;
            }

            .storymap-btn {
                padding: 7px 15px;
                font-size: 13px;
            }

            .modal-container {
                width: 95%;
                height: 88vh;
            }
        }
    </style>
</head>
<body>

    <!-- 右上角彈窗觸發按鈕 -->
    <div class="top-nav">
        <a href="#storymap-popup" class="storymap-btn">台中一日遊 Story Map</a>
    </div>

    <!-- 彈跳視窗本體 -->
    <div id="storymap-popup" class="modal-overlay">
        <a href="#" class="modal-backdrop-close" aria-label="關閉視窗"></a>
        <div class="modal-container">
            <div class="modal-header">
                <h3>台中一日
